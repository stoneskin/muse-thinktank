<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<style>
.tt-title{fill:#1f2328;font-size:13px;font-weight:700;}
.tt-sub{fill:#59636e;font-size:10.5px;}
.tt-edge{fill:none;stroke:#59636e;stroke-width:2;stroke-dasharray:7 6;animation:ttflow 0.9s linear infinite;}
@keyframes ttflow{to{stroke-dashoffset:-13;}}
.tt-lab{fill:#59636e;font-size:10px;}
.tt-seq{animation:ttseq 8s ease-in-out infinite;}
.tt-seq.q2{animation-delay:1s;}.tt-seq.q3{animation-delay:2s;}.tt-seq.q4{animation-delay:3s;}
.tt-seq.q5{animation-delay:4s;}.tt-seq.q6{animation-delay:5s;}.tt-seq.q7{animation-delay:6s;}
@keyframes ttseq{0%,100%{opacity:0.35;}6%{opacity:1;}20%{opacity:1;}28%{opacity:0.35;}}
.tt-dia{animation:ttdia 8s ease-in-out infinite;animation-delay:5s;}
@keyframes ttdia{0%,100%{opacity:0.35;}6%{opacity:1;}20%{opacity:1;}28%{opacity:0.35;}}
</style>
<!-- edges -->
<path class="tt-edge" d="M340 64 L340 88"/>
<path class="tt-edge" d="M340 128 C340 145, 200 145, 140 160"/>
<path class="tt-edge" d="M340 128 L340 160"/>
<path class="tt-edge" d="M340 128 C340 145, 480 145, 530 160"/>
<path class="tt-edge" d="M140 224 C200 244, 260 246, 308 248"/>
<path class="tt-edge" d="M340 224 L340 248"/>
<path class="tt-edge" d="M530 224 C470 244, 410 246, 372 248"/>
<path class="tt-edge" d="M300 292 C280 300, 252 308, 238 320"/>
<path class="tt-edge" d="M380 292 C400 300, 428 308, 442 320"/>
<path class="tt-edge" d="M315 384 C300 400, 292 414, 289 426"/>
<path class="tt-edge" d="M368 384 C382 400, 389 414, 391 426"/>
<path class="tt-edge" d="M340 462 C340 482, 200 482, 172 500"/>
<path class="tt-edge" d="M392 430 C430 448, 468 470, 498 500"/>
<!-- nodes -->
<g class="tt-seq q1">
<rect x="260" y="20" width="160" height="44" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2.5"/>
<text class="tt-title" x="340" y="47" text-anchor="middle">Stone 提问「上智囊团」</text>
</g>
<g class="tt-seq q2">
<rect x="250" y="88" width="180" height="40" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="340" y="112" text-anchor="middle" font-size="12" fill="#1f2328" font-weight="600">estimate 费用 → Stone 批准</text>
</g>
<g class="tt-seq q3">
<rect x="60" y="160" width="150" height="64" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2.5"/>
<text class="tt-title" x="135" y="186" text-anchor="middle" font-size="12">Panel A</text>
<text class="tt-sub" x="135" y="205" text-anchor="middle">DeepSeek 作答</text>
<rect x="265" y="160" width="150" height="64" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2.5"/>
<text class="tt-title" x="340" y="186" text-anchor="middle" font-size="12">Panel B</text>
<text class="tt-sub" x="340" y="205" text-anchor="middle">Gemini 作答</text>
<rect x="470" y="160" width="150" height="64" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2.5"/>
<text class="tt-title" x="545" y="186" text-anchor="middle" font-size="12">Panel C</text>
<text class="tt-sub" x="545" y="205" text-anchor="middle">… 并行作答</text>
<rect x="272" y="130" width="136" height="22" rx="11" fill="#eaeef2" stroke="#d1d9e0"/>
<text x="340" y="145" text-anchor="middle" font-size="10" fill="#59636e">N 模型 fan-out 并行</text>
</g>
<g class="tt-seq q4">
<rect x="250" y="248" width="180" height="44" rx="10" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="tt-sub" x="340" y="274" text-anchor="middle" font-size="12">对抗轮 red-team（可选）</text>
</g>
<g class="tt-seq q5">
<rect x="140" y="320" width="180" height="64" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2.5"/>
<text class="tt-title" x="230" y="346" text-anchor="middle" font-size="12">Judge ①</text>
<text class="tt-sub" x="230" y="365" text-anchor="middle">打分 + 置信度</text>
<rect x="360" y="320" width="180" height="64" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2.5"/>
<text class="tt-title" x="450" y="346" text-anchor="middle" font-size="12">Judge ②</text>
<text class="tt-sub" x="450" y="365" text-anchor="middle">异构交叉验证</text>
<rect x="282" y="392" width="116" height="22" rx="11" fill="#eaeef2" stroke="#d1d9e0"/>
<text x="340" y="407" text-anchor="middle" font-size="10" fill="#59636e">双 judge 并行</text>
</g>
<g class="tt-dia">
<polygon points="340,418 392,450 340,482 288,450" fill="#f6f8fa" stroke="#8250df" stroke-width="2.5"/>
<text class="tt-title" x="340" y="446" text-anchor="middle">判定</text>
<text class="tt-sub" x="340" y="464" text-anchor="middle">一致？</text>
</g>
<text class="tt-lab" x="252" y="492" text-anchor="middle">一致 ✓</text>
<text class="tt-lab" x="448" y="462" text-anchor="middle">分歧 / 低置信</text>
<g class="tt-seq q7">
<rect x="80" y="500" width="180" height="60" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2.5"/>
<text class="tt-title" x="170" y="524" text-anchor="middle" font-size="12">synth 合成</text>
<text class="tt-sub" x="170" y="543" text-anchor="middle">最终结论 + 成本小结</text>
<rect x="420" y="500" width="180" height="60" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2.5"/>
<text class="tt-title" x="510" y="524" text-anchor="middle" font-size="12">Stone 人终审</text>
<text class="tt-sub" x="510" y="543" text-anchor="middle">亲自裁 · 分歧点摆出来</text>
</g>
<rect x="140" y="572" width="400" height="24" rx="12" fill="#eaeef2" stroke="#d1d9e0"/>
<text x="340" y="588" text-anchor="middle" font-size="10" fill="#59636e">One prompt, a council of models, zero hallucinations.</text>
</svg>
